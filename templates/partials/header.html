<!doctype html>
<html lang="{{ lang or 'mr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9b2c22">
  <meta name="description" content="Saileela Mandal Palkhi: devotion, Palkhi participation and seva.">
  <meta property="og:title" content="Saileela Mandal Palkhi">
  <meta property="og:description" content="The Saileela Mandal Palkhi digital home.">
  <meta property="og:image" content="{{ site.og_image_path }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{ title if title is defined and title else site.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="{{ site.logo_path }}">
  <script>document.documentElement.dataset.lang = '{{ lang or "mr" }}';</script>
  <script src="/js/i18n.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand-logo" href="/" aria-label="Saileela Mandal Palkhi home"><img src="{{ site.logo_path }}" alt="{{ site.marathi_name }} logo"><span><strong data-i18n="mandal_name_header">{{ site.marathi_short_name }}</strong><small data-i18n="mandal_sub_header">{{ site.marathi_tagline }}</small></span></a>
    <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Toggle navigation">☰</button>
    <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
      <a href="/" class="{{ 'active' if activeTab == 'home' else '' }}" data-i18n="nav_home">मुखपृष्ठ</a><a href="/about" class="{{ 'active' if activeTab == 'about' else '' }}" data-i18n="nav_about">आमच्याबद्दल</a><a href="/schedule" class="{{ 'active' if activeTab == 'schedule' else '' }}" data-i18n="nav_schedule">पालखी / यात्रा</a><a href="/glimpses" class="{{ 'active' if activeTab == 'glimpses' else '' }}" data-i18n="nav_glimpses">छायाचित्रे</a><a href="/social-work" class="{{ 'active' if activeTab == 'socialwork' else '' }}" data-i18n="nav_socialwork">सेवा</a><a href="/contact" class="{{ 'active' if activeTab == 'contact' else '' }}" data-i18n="nav_contact">संपर्क</a><a href="/donate" class="nav-donate" data-i18n="nav_donate">देणगी / सेवा</a>
      <div class="language-switcher"><button class="lang-btn" data-lang="mr" type="button">मराठी</button><button class="lang-btn" data-lang="en" type="button">English</button></div>
    </nav>
  </div></header>
