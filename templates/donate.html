{% include 'partials/header.html' %}<script src="https://checkout.razorpay.com/v1/checkout.js"></script><section class="page-hero"><div class="container"><p class="eyebrow">Saileela Seva</p><h1 data-i18n="donate_title">Saileela Seva Donation</h1><p data-i18n="donate_sub">Offer a contribution to Saileela Mandal Palkhi.</p></div></section><section class="content-section"><div class="container"><form id="donationForm" class="form-card"><h2 data-i18n="donate_form_title">Seva contribution</h2><div class="form-grid"><div class="field"><label for="donationAmount" data-i18n="lbl_custom_amount">Amount</label><input id="donationAmount" type="number" min="1" required></div><div class="field"><label for="donorName" data-i18n="lbl_donor_name">Full name</label><input id="donorName" required data-i18n="ph_donor_name"></div><div class="field"><label for="donorPhone" data-i18n="lbl_mobile">Mobile number</label><input id="donorPhone" type="tel" required data-i18n="ph_mobile"></div><div class="field"><label for="donorEmail" data-i18n="lbl_email">Email</label><input id="donorEmail" type="email" data-i18n="ph_email"></div><div class="field full"><label for="donorPan">PAN (optional, only if officially required)</label><input id="donorPan" maxlength="10"></div></div><button class="button button-primary" id="btnDonateSubmit" type="submit" data-i18n="btn_donate_submit">Continue to secure payment</button><p id="donationStatus" class="muted" role="status"></p></form></div></section><script>
document.getElementById('donationForm').addEventListener('submit', async (event) => { event.preventDefault(); const button = document.getElementById('btnDonateSubmit'); const status = document.getElementById('donationStatus'); const amount = Number(document.getElementById('donationAmount').value); button.disabled = true; status.textContent = 'Connecting to secure payment...'; try { const orderResponse = await fetch('/api/create-donation-order', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount}) }); const order = await orderResponse.json(); if (!order.success || !window.Razorpay) throw new Error(order.message || 'Live payment is not configured.'); const options = { key: order.order.key_id, amount: order.order.amount, currency:'INR', name:'Saileela Mandal Palkhi', description:'Saileela Seva contribution', image:'/images/logo.png', order_id:order.order.order_id, handler: async (payment) => { const response = await fetch('/api/confirm-donation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receipt_no:order.receipt_no,donor_name:document.getElementById('donorName').value,phone:document.getElementById('donorPhone').value,email:document.getElementById('donorEmail').value,pan_number:document.getElementById('donorPan').value,amount,payment_id:payment.razorpay_payment_id,order_id:payment.razorpay_order_id,signature:payment.razorpay_signature})}); const result = await response.json(); if (!result.success) throw new Error(result.message); window.location.href='/download-receipt/'+result.receipt_no; }, modal:{ondismiss:()=>{button.disabled=false;status.textContent='Payment cancelled.';}} }; new window.Razorpay(options).open(); } catch(error) { status.textContent=error.message; button.disabled=false; } });
</script>{% include 'partials/footer.html' %}
